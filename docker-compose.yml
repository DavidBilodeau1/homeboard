services:
  homeboard:
    # released images follow `v*` tags; `--build` builds from source instead
    image: ghcr.io/davidbilodeau1/homeboard:latest
    build: .
    container_name: homeboard
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "8090:8090"
    environment:
      HA_URL: ${HA_URL:?set HA_URL in .env}
      HA_TOKEN: ${HA_TOKEN:?set HA_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      EDITOR_ENABLED: ${EDITOR_ENABLED:-1}
      # plugin connections, each optional; turn the plugin on in Settings → Plugins
      FRIGATE_URL: ${FRIGATE_URL:-}
      FRIGATE_USER: ${FRIGATE_USER:-}
      FRIGATE_PASSWORD: ${FRIGATE_PASSWORD:-}
      FRIGATE_TOKEN: ${FRIGATE_TOKEN:-}
      EXPENSAVE_URL: ${EXPENSAVE_URL:-}
      EXPENSAVE_EMAIL: ${EXPENSAVE_EMAIL:-}
      EXPENSAVE_PASSWORD: ${EXPENSAVE_PASSWORD:-}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      # for a Home Assistant with a self-signed certificate:
      # NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - ./config:/app/config
      - ./photos:/app/photos:ro
    restart: unless-stopped
